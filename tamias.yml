# tamias.yml — repo-level tamias config (dogfooding). YAML is the standard;
# tamias.toml is the supported alternative. Search order: --file →
# $TAMIAS_CONFIG → ./tamias.yml → ./tamias.yaml → ./tamias.toml
# → ~/.config/tamias/tamias.yml. Refs and secret NAMES — never values.

# Local install store + fetch cache (defaults shown).
store:
  kind: local
  # root: ~/.local/share/tamias/store

cache:
  kind: local
  # root: ~/.cache/tamias/fetch

# The org registry — Cloudflare Worker + R2 at tamias.9aia.com
# (`tamias deploy-registry` materializes it; bearer token via
# TAMIAS_REGISTRY_TOKEN, value lives sealed in the `secrets-9aia`
# pack — consumption ref `cuora://secrets-9aia/registry-token`,
# inject with `cuora run -s …`; the cuora engine resolves installed
# sealed packs natively on vault miss).
#
# Canonical home (T-037): the `secrets-9aia` sealed pack
# (workspace/libraries/secrets-9aia, published to the org registry) —
# age ciphertext, opened consumer-side by recipient keyholders. The
# token is env-agnostic, so one sealed copy retires the old
# vault/env ambiguity (it was seeded under every env of vault `nine`
# — dev/staging/preview/prod — plus a mirror in the personal vault
# cuora.luisfuturist.com; those vault copies are deleted post-migration).
#
# Migration status (PL-017): COMPLETED — engine pack-ref resolution
# landed (cuora 9fd14a0: `cuora get`/`run -s`/`env` fall back to
# installed sealed packs on vault miss, vault-first), `secrets-9aia`
# v1.0.1 is published + installed, and the `nine` + personal-vault
# `tamias/registry-token` entries are deleted. `cuora://tamias/
# signing-key` deliberately stays vault-resident: it is a PUBLISHER
# credential (tamias-sign), not a consumer secret — sealing it into
# a pack would distribute the private key to every recipient.
registries:
  nine:
    kind: cf
    url: https://tamias.9aia.com
    token_env: TAMIAS_REGISTRY_TOKEN

# Publish-target routing — `tamias publish --registry nine`.
# publish:
#   default: local
