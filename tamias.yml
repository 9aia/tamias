# tamias.yml — repo-level tamias config (dogfooding). YAML is the standard;
# tamias.toml is the supported alternative. Search order: --file →
# $TAMIAS_CONFIG → ./tamias.yml → ./tamias.yaml → ./tamias.toml
# → ~/.config/tamias/tamias.yml. Refs and secret NAMES — never values.

# Local install store + fetch cache (defaults shown).
store:
  kind: local
  # root: ~/.local/share/tamias/store

cache:
  kind: local
  # root: ~/.cache/tamias/fetch

# The org registry — Cloudflare Worker + R2 at tamias.9aia.com
# (`tamias deploy-registry` materializes it; bearer token via
# TAMIAS_REGISTRY_TOKEN, value lives in cuora as
# cuora://tamias/registry-token — inject with `cuora run -s …`).
#
# Canonical home (T-037): the ORG vault — `nine` (cuora.9aia.com),
# reached via a cuora.toml routing envs → `nine` (e.g. the cuora
# repo's). The token is env-agnostic, so it is seeded under every
# env (dev/staging/preview/prod) — `--env` cannot pick a wrong
# slot. The personal vault (cuora.luisfuturist.com) carries a
# mirror copy for personal-dev convenience; it is NOT authoritative
# — org consumers must resolve through the org vault.
#
# Migration status (PL-017): the token now ALSO ships sealed in the
# `secrets-9aia` pack (workspace/libraries/secrets-9aia, published to
# the org registry) — consumption ref `cuora://secrets-9aia/
# registry-token`. Vault entries stay until engine pack-ref
# resolution (cuora T-051) lands and consumers are verified on the
# pack path; deletion is a separate, later step. `cuora://tamias/
# signing-key` deliberately stays vault-resident: it is a PUBLISHER
# credential (tamias-sign), not a consumer secret — sealing it into
# a pack would distribute the private key to every recipient.
registries:
  nine:
    kind: cf
    url: https://tamias.9aia.com
    token_env: TAMIAS_REGISTRY_TOKEN

# Publish-target routing — `tamias publish --registry nine`.
# publish:
#   default: local
