[workspace]
resolver = "2"
members = [
    "crates/tamias-cli",
    "crates/tamias-cache",
    "crates/tamias-cache-local",
    "crates/tamias-config",
    "crates/tamias-config-yml",
    "crates/tamias-config-toml",
    "crates/tamias-driver",
    "crates/tamias-install",
    "crates/tamias-core",
    "crates/tamias-deploy",
    "crates/tamias-deploy-systemd",
    "crates/tamias-deploy-windows",
    "crates/tamias-deploy-cf",
    "crates/tamias-publish",
    "crates/tamias-provider",
    "crates/tamias-registry",
    "crates/tamias-registry-local",
    "crates/tamias-registry-open",
    "crates/tamias-registry-cf",
    "crates/tamias-store-cf",
    "crates/tamias-cache-cf",
    "crates/tamias-serve",
    "crates/tamias-shell",
    "crates/tamias-sign",
    "crates/tamias-source",
    "crates/tamias-source-cf",
    "crates/tamias-source-fs",
    "crates/tamias-source-git",
    "crates/tamias-source-http",
    "crates/tamias-store",
    "crates/tamias-store-local",
    "crates/tamias-tui",
    "crates/tamias-telemetry",
    "crates/tamias-testkit",
    "xtask",
]
# tamias-driver-tamias is excluded: it keeps its own `[workspace]` +
# lockfile and ships as a standalone driver binary (its pavo deps are
# git deps now, so no sibling checkout is needed). It is still covered
# by xtask check/test via its own manifest.
exclude = ["crates/tamias-driver-tamias"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/tamias"
description = "Package & content manager for the agent factory — fetch, store, cache, dispense"
homepage = "https://9aia.com/tamias"
documentation = "https://9aia.com/tamias"
authors = ["9aia"]
keywords = ["package-manager", "content", "cli", "distribution"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
tamias = { path = "crates/tamias-cli", version = "0.1.0" }
tamias-cache = { path = "crates/tamias-cache", version = "0.1.0" }
tamias-cache-local = { path = "crates/tamias-cache-local", version = "0.1.0" }
tamias-config = { path = "crates/tamias-config", version = "0.1.0" }
tamias-config-yml = { path = "crates/tamias-config-yml", version = "0.1.0" }
tamias-config-toml = { path = "crates/tamias-config-toml", version = "0.1.0" }
tamias-driver = { path = "crates/tamias-driver", version = "0.1.0" }
tamias-install = { path = "crates/tamias-install", version = "0.1.0" }
tamias-core = { path = "crates/tamias-core", version = "0.1.0" }
tamias-deploy = { path = "crates/tamias-deploy", version = "0.1.0" }
tamias-deploy-systemd = { path = "crates/tamias-deploy-systemd", version = "0.1.0" }
tamias-deploy-windows = { path = "crates/tamias-deploy-windows", version = "0.1.0" }
tamias-deploy-cf = { path = "crates/tamias-deploy-cf", version = "0.1.0" }
tamias-publish = { path = "crates/tamias-publish", version = "0.1.0" }
tamias-provider = { path = "crates/tamias-provider", version = "0.1.0" }
tamias-registry = { path = "crates/tamias-registry", version = "0.1.0" }
tamias-registry-local = { path = "crates/tamias-registry-local", version = "0.1.0" }
tamias-registry-open = { path = "crates/tamias-registry-open", version = "0.1.0" }
tamias-registry-cf = { path = "crates/tamias-registry-cf", version = "0.1.0" }
tamias-store-cf = { path = "crates/tamias-store-cf", version = "0.1.0" }
tamias-cache-cf = { path = "crates/tamias-cache-cf", version = "0.1.0" }
tamias-serve = { path = "crates/tamias-serve", version = "0.1.0" }
tamias-shell = { path = "crates/tamias-shell", version = "0.1.0" }
tamias-sign = { path = "crates/tamias-sign", version = "0.1.0" }
tamias-source = { path = "crates/tamias-source", version = "0.1.0" }
tamias-source-cf = { path = "crates/tamias-source-cf", version = "0.1.0" }
tamias-source-fs = { path = "crates/tamias-source-fs", version = "0.1.0" }
tamias-source-git = { path = "crates/tamias-source-git", version = "0.1.0" }
tamias-source-http = { path = "crates/tamias-source-http", version = "0.1.0" }
tamias-store = { path = "crates/tamias-store", version = "0.1.0" }
tamias-store-local = { path = "crates/tamias-store-local", version = "0.1.0" }
tamias-tui = { path = "crates/tamias-tui", version = "0.1.0" }
tamias-telemetry = { path = "crates/tamias-telemetry", version = "0.1.0" }
tamias-testkit = { path = "crates/tamias-testkit", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
tempfile = "3"
temp-env = "0.3"
sigpipe = "0.1"
schemars = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
serde_yaml_ng = "0.10"
proptest = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tar = "0.4"
flate2 = "1"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
ratatui = "0.30"
crossterm = "0.29"
notify = "8"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
unwrap_used = "warn"
