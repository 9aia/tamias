# `tamias-xtask`, not `xtask`: a shared CARGO_TARGET_DIR across repos
# keys fingerprints/binaries by package name — a foreign `xtask`
# package could own target/debug/xtask and run for `cargo xtask`
# here (I-002).
[package]
name = "tamias-xtask"
description = "Repo chores: check / test / coverage / install / site"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tamias-core.workspace = true
tamias-publish.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
