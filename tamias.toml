# tamias.toml — repo-level tamias config (dogfooding). Search order:
# --config → $TAMIAS_CONFIG → ./tamias.toml → ~/.config/tamias/tamias.toml.
# Refs and secret NAMES — never values.

# Local install store + fetch cache (defaults shown).
[store]
kind = "local"
# root = "~/.local/share/tamias/store"

[cache]
kind = "local"
# root = "~/.cache/tamias/fetch"

# A Cloudflare registry (Worker + R2 + D1/KV) — wired at P6.
# [registries.cloud]
# kind = "cf"
# url = "https://tamias-registry.you.workers.dev"
# token_env = "TAMIAS_CF_TOKEN"      # env var NAME — never the token

# Publish-target routing — `tamias publish --registry cloud`.
# [publish]
# default = "local"
