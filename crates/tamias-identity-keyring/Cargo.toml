[package]
name = "tamias-identity-keyring"
description = "Identity impl: the platform session secret store (secret-service / Keychain / Credential Manager) via keyring-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["secrets", "tamias", "age", "identity", "keyring"]
categories = ["development-tools"]

[dependencies]
age.workspace = true
tamias-identity.workspace = true
keyring-core.workspace = true

# One native, synchronous credential store per platform — no async
# runtime in the binary (AGENTS.md). Linux/*nix: secret-service via
# libdbus (vendored → no system -dev packages needed). macOS:
# login keychain. Windows: Credential Manager.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[lints]
workspace = true
