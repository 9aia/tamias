[package]
name = "tamias-driver-tamias"
description = "tamias-driver-tamias — pavo view driver over the tamias install store, fetch cache, registry index, and driver dir (read-only)"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/tamias"
homepage = "https://9aia.com/tamias"
documentation = "https://9aia.com/tamias"
authors = ["9aia"]
keywords = ["pavo", "tamias", "package-manager"]
categories = ["development-tools"]
# Never published to crates.io: this binary ships as a tamias
# driver, not a library.
publish = false

[[bin]]
name = "tamias-driver-tamias"
path = "src/main.rs"

[dependencies]
tamias-core = { path = "../tamias-core" }
# The engine lib — the ops surface (`ops` manifest + `cli.<verb>`
# wire queries) derives from `tamias::command()` and re-execs
# `tamias::run_from` in `run`/`cli` children. `default-features =
# false` keeps the `tui` feature (and tamias-tui) out of the driver:
# `tamias ui` stays a native-only surface.
tamias = { path = "../tamias-cli", default-features = false }
clap = "4"
tamias-store-local = { path = "../tamias-store-local" }
tamias-cache-local = { path = "../tamias-cache-local" }
tamias-registry = { path = "../tamias-registry" }
tamias-registry-local = { path = "../tamias-registry-local" }
tamias-driver = { path = "../tamias-driver" }
serde_json = "1"
# The public wire contract + driver-authoring kit — git deps until
# pavo lands on the registry (`version` is the crates.io fallback).
# All pavo crates share the one git source so the kit's
# pavo-protocol types stay identical to this crate's.
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0" }
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-tamias serve` binary.
pavo-testkit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

# Mirrors the parent workspace's [workspace.lints] — this crate is
# excluded from that workspace (see the root Cargo.toml `exclude`).
[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
unwrap_used = "warn"

# Own workspace root: keeps `cargo` commands run inside this directory
# from resolving the parent workspace (and its members) at all.
[workspace]
