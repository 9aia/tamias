[package]
name = "tamias-driver-tamias"
description = "tamias-driver-tamias — pavo view driver over the tamias install store, fetch cache, registry index, and driver dir (read-only)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pavo", "tamias", "package-manager"]
categories = ["development-tools"]

[[bin]]
name = "tamias-driver-tamias"
path = "src/main.rs"

[dependencies]
tamias-core.workspace = true
tamias-store-local.workspace = true
tamias-cache-local.workspace = true
tamias-registry.workspace = true
tamias-registry-local.workspace = true
tamias-driver.workspace = true
serde_json.workspace = true
# The public wire contract — sibling-checkout path dep until
# pavo-protocol is published (the whole 9aia org lives side-by-side
# under one parent dir; `version` is the crates.io fallback).
pavo-protocol = { path = "../../../pavo/crates/pavo-protocol", version = "0.1.0" }

[dev-dependencies]
tempfile.workspace = true
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-tamias serve` binary.
pavo-testkit = { path = "../../../pavo/crates/pavo-testkit" }

[lints]
workspace = true
