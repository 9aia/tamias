[package]
name = "tamias"
description = "tamias — secrets broker for agents: reference URIs, redaction, env-injection CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["secrets", "tamias"]
categories = ["development-tools"]

[[bin]]
name = "tamias"
path = "src/main.rs"

[dependencies]
tamias-core = { workspace = true, features = ["schema"] }
tamias-config.workspace = true
tamias-config-toml.workspace = true
tamias-ops.workspace = true
tamias-serve.workspace = true
tamias-shell.workspace = true
tamias-vault.workspace = true
tamias-tui = { workspace = true, optional = true }
clap.workspace = true
clap-markdown.workspace = true
serde_json.workspace = true
schemars.workspace = true
sigpipe.workspace = true
rpassword.workspace = true

[features]
default = ["tui"]
## `tamias ui` — interactive vault TUI.
## `--no-default-features` keeps the lean agent binary.
tui = ["dep:tamias-tui"]

[dev-dependencies]
tamias-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true
temp-env.workspace = true

[lints]
workspace = true
