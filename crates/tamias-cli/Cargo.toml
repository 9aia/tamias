[package]
name = "tamias"
description = "tamias — package & content manager: fetch, store, cache, dispense"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true

[[bin]]
name = "tamias"
path = "src/main.rs"

[dependencies]
tamias-core.workspace = true
tamias-install.workspace = true
tamias-store-local.workspace = true
tamias-telemetry.workspace = true
tracing.workspace = true
tamias-cache-local.workspace = true
tamias-driver.workspace = true
tamias-serve.workspace = true
tamias-registry-local.workspace = true
tamias-registry-open.workspace = true
tamias-registry.workspace = true
tamias-deploy.workspace = true
tamias-deploy-cf.workspace = true
tamias-deploy-local.workspace = true
tamias-publish.workspace = true
tamias-provider.workspace = true
tamias-config.workspace = true
tamias-config-yml.workspace = true
tamias-config-toml.workspace = true
tamias-shell.workspace = true
tamias-sign.workspace = true
tamias-tui = { workspace = true, optional = true }
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
schemars.workspace = true
sigpipe.workspace = true

[features]
default = ["tui"]
## `tamias ui` — interactive package-manager TUI (ratatui/crossterm).
## `--no-default-features` keeps the lean binary.
tui = ["dep:tamias-tui"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
