[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support — none: install is `cargo install --git`,
# no release CI (dist 0.33 no longer accepts the string "none")
ci = []
# The installers to generate for each app — none for now: the
# "shell" installer makes dist 0.33 panic in compute_releases on
# this virtual workspace (same in myco); publish is
# `cargo install --git`, so dist only needs to plan archives.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
# host arch only; other targets join via remote workers (TODO)
targets = ["x86_64-unknown-linux-gnu"]
