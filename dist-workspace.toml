[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backend: github-actions — .github/workflows/release.yml is
# generated by `cargo dist generate --mode ci` and builds archives on
# dist-able package tags (tamias-v*, tamias-tui-v*), then creates a
# GitHub Release with the artifacts. crates.io publish stays with
# tarsi-serve (scripts/release.sh); the two planes are independent.
ci = ["github"]
# The installers to generate for each app — none: the "shell"
# installer makes dist 0.33 panic in compute_releases on this virtual
# workspace (same in myco); archives (.tar.xz + checksums) are all
# consumers need.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
# host arch only; other targets join via remote workers (TODO)
targets = ["x86_64-unknown-linux-gnu"]
