name: Setup tamias
description: Install the tamias CLI from source on a GitHub Actions runner.

inputs:
  ref:
    description: >-
      Git ref of 9aia/tamias to install. Pin a release tag such as
      tamias-v0.1.5 for reproducible builds (see README).
    required: false
    default: main
  cargo-args:
    description: >-
      Extra arguments appended to the `cargo install` command
      (e.g. "--no-default-features" or feature flags).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install tamias
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        CARGO_ARGS: ${{ inputs.cargo-args }}
      run: |
        set -euo pipefail
        # --locked requires Cargo.lock to stay untouched; the repo ships one.
        # --tag selects the git tag of the source repo.
        cargo install tamias \
          --git https://github.com/9aia/tamias \
          --tag "${REF}" \
          --locked \
          ${CARGO_ARGS}

    - name: Verify installation
      shell: bash
      run: |
        set -euo pipefail
        # cargo install lands in ~/.cargo/bin, already on PATH on GH runners.
        command -v tamias
        tamias --version
