# cypera — org docs/reference generation contract (see ../cypera).
# Discovered upward from the repo root; `bun run docs:gen` inside
# docs/ drives `cypera gen crate-map|cli|config` with no flags.

[crate_map]
order = ["domain", "port", "ops", "adapter", "binary"]

[crate_map.layers]
"tamias" = "binary"
"tamias-core" = "domain"
"tamias-config" = "port"
"tamias-deploy" = "port"
"tamias-source" = "port"
"tamias-store" = "port"
"tamias-cache" = "port"
"tamias-registry" = "port"

[[crate_map.splices]]
target = "docs/explanation/architecture.md"
marker = "<!-- crate-map -->"

[crate_map.crate_api]
site = "tamias"
out = "docs/reference/crate-api.md"

[cli]
package = "tamias"
bin = "tamias"
prefix = []
# `driver exec` disables its own --help (passthrough to the kind
# driver) — nothing to walk. `bin exec` is `hide = true` and never
# appears in the parent's Commands list.
skip = ["driver exec"]
out = "docs/reference/cli.md"

[config]
title = "Config — `tamias.yml` / `tamias.yaml` / `tamias.toml`"
out = "docs/reference/config.md"
types = { "String" = "string", "PathBuf" = "path", "bool" = "bool", "u16" = "int", "u64" = "int", "usize" = "int", "Vec<String>" = "list", "Vec<Op>" = "op list", "BTreeMap<String, VaultConfig>" = "{name: vault}", "BTreeMap<Env, EnvRoute>" = "{env: vault|{vault}}", "BTreeMap<String, Ref>" = "{VAR: tamias://ref}", "BTreeMap<String, DeployConfig>" = "{name: target}", "BTreeMap<String, Limits>" = "{pkg: limits}", "BTreeMap<String, Retention>" = "{pkg: retention}", "Guardrails" = "table", "GuardDefault" = "\"allow\"|\"deny\"", "ServeConfig" = "table", "PdpConfig" = "table" }
all_optional = ["Config"]

[[config.structs]]
file = "crates/tamias-config/src/lib.rs"
name = "Location"
title = "`store` / `cache` — an install/fetch location"
[[config.structs]]
file = "crates/tamias-config/src/lib.rs"
name = "Registry"
title = "`registries.NAME` — a named registry"
[[config.structs]]
file = "crates/tamias-config/src/lib.rs"
name = "Publish"
title = "`[publish]` — publish routing"
[[config.structs]]
file = "crates/tamias-config/src/lib.rs"
name = "Signing"
title = "`[signing]` — package signing policy"
[[config.structs]]
file = "crates/tamias-config/src/lib.rs"
name = "Retention"
title = "`[retention]` — publish retention (P-024)"
[[config.structs]]
file = "crates/tamias-config/src/lib.rs"
name = "Config"
title = "Top level"
[[config.structs]]
file = "crates/tamias-config/src/lib.rs"
name = "Search"
title = "`[search]` — search routing"

[[config.sections]]
title = "`store` / `cache` — an install/fetch location"
struct = "Location"
[[config.sections]]
title = "`registries.NAME` — a named registry"
struct = "Registry"
[[config.sections]]
title = "`[publish]` — publish routing"
struct = "Publish"
[[config.sections]]
title = "`[signing]` — package signing policy"
struct = "Signing"
[[config.sections]]
title = "`[retention]` — publish retention (P-024)"
struct = "Retention"
[[config.sections]]
title = "Top level"
struct = "Config"
[[config.sections]]
title = "`[search]` — search routing"
struct = "Search"
[[config.sections]]
title = "`[limits]` — byte limits + per-package overrides"
text = """
| field | type | notes |
|---|---|---|
| `max_upload` | int | Largest payload tarball a publish may upload, in bytes. |
| `max_download` | int | Largest tarball a fetch may download, in bytes. |
| `packages` | `{pkg: limits}` | Per-package overrides — exact name or `*` glob → limits. |

`Limits` uses byte-count serde (`256MiB`-style values also accepted);
a `limits:` block under `registries.<name>` overrides the global
policy for that registry. Documented here as text because the
struct's `u64` fields use custom serde helpers cypera's parser
skips.
"""
[[config.sections]]
title = "Formats"
text = """
YAML is the standard — `tamias.yml` or `tamias.yaml`; `tamias.toml`
parses into the same `Config`. Read-side resolution is **layered**:
the user-level `~/.config/tamias/tamias.*` (`$XDG_CONFIG_HOME`
wins) is the base and a `./tamias.{yml,yaml,toml}` in the cwd
overlays it per-field — project wins, global fills the gaps.
`--file`/`TAMIAS_CONFIG` replaces discovery with that one file.
Registry *writes* (`tamias registry add|remove`) stay file-scoped:
they edit the project `tamias.*` (or `--file` target), never the
user layer implicitly. The merged config informs `doctor`'s
registry check (`publish.default` → `registries.NAME`).
"""
[[config.sections]]
title = "Constraints"
text = """
- Token values never live in the file — `token_env` fields name
  the env var that carries them (the http client reads
  `TAMIAS_REGISTRY_TOKEN`).
- `tamias config --json` dumps the effective config;
  `tamias schema` emits the JSON Schema for the *package* manifest
  (`tamias.yaml`), a different document.
"""

[check]
profile = "engine"
